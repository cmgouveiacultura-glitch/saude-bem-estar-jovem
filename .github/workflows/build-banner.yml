name: Build final banner

on:
  push:
    paths:
      - 'assets/banner-b64/3.txt'

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild banner image
        run: |
          mkdir -p assets
          cat assets/banner-b64/0.txt assets/banner-b64/1.txt assets/banner-b64/2.txt assets/banner-b64/3.txt | tr -d '\n' | base64 -d > assets/banner-header.jpg
          rm -rf assets/banner-b64
      - name: Commit banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-header.jpg assets/banner-b64
          git commit -m "Adicionar banner final ao cabeçalho" || exit 0
          git push
